modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/EjafiSoftware/minecraft-egqol/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/EjafiSoftware/minecraft-egqol"
logoFile = "logo.png"
authors = "Ejafi Games"
description = '''
Ejafi Games Quality of Life (EGQoL) adds small conveniences to Minecraft, such as cutting wool back into string with shears.
'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
